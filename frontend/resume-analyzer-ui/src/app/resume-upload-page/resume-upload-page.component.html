<div class="page-wrapper">

  <h1>Resume Analyser</h1>
  <p class="subtitle">Paste a job description and upload your resume to see how well they match.</p>

  <!-- job description -->
  <label class="field-label" for="jobDescription">Job description</label>
  <textarea
    id="jobDescription"
    class="job-description-input"
    placeholder="Enter the job description to compare your resume with..."
    [(ngModel)]="jobDescription"
  ></textarea>

  <!-- resume upload -->
  <label class="field-label">Resume</label>


<div class="resume-upload-box" id="uploadBox" [class.drag-over]="isDragging" (click)="resumeInput.click()"
    (dragover)="onDragOver($event)" (dragleave)="onDragLeave($event)" (drop)="onDrop($event)">
    <div class="upload-icon">📄</div>
    <p class="upload-text">Click to upload, or drag and drop your resume here</p>
    <p class="upload-subtext">PDF or DOCX</p>
  </div>

  <input 
  #resumeInput 
  class="resume-upload-input" 
  id="resumeInput" 
  type="file" 
  (change)="onFileSelected($event)"
   />

  <!-- shown once a file is selected, hidden otherwise -->
  <div class="file-name-display" id="fileNameDisplay" *ngIf= "selectedFile">Selected: {{selectedFile.name}}</div>

  <!-- analyze button -->
  <button 
  class="analyze-button" 
  id="analyzeButton"
  [disabled]="!selectedFile || !jobDescription"
  (click)="onAnalyzeClick()"
  >Analyze</button>

</div>
